# NR-TOA UE / positioning receiver — USRP
sdr = usrp
sdr_addrs = serial=2512531
clock_source = internal
time_source = internal
center_freq_hz = 3600000000
sample_rate_hz = 30720000
# If center_freq_hz is the carrier center instead of the SS/PBCH block center,
# set one of the following from OAI's SSB/SSRef information.
# ssb_freq_offset_hz = 0
# ssb_offset_subcarriers = 0
# pbch_lmax = 8
rx_gain_db = 30
tx_gain_db = 0
mode = SSB_TOA
anchor_db_path = targets/PROJECTS/NR-TOA/CONF/anchors.csv
