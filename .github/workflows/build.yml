name: Build and test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [offline, radio, all-offline, gnss-radio]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libuhd-dev libfftw3-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
      - name: Check main configuration without opening SDR
        if: matrix.preset != 'gnss-radio'
        run: |
          build/${{ matrix.preset }}/src/5G/nr-config-check config/config.f receiver
          build/${{ matrix.preset }}/src/5G/nr-config-check config/config.f anchor
      - name: Check BDS radio configuration without opening SDR
        if: matrix.preset == 'gnss-radio'
        run: sh run_BDS_only.sh --check
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install optional browser QA dependencies
        run: |
          npm install --prefix ui/tests --no-audit --no-fund
          ui/tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Check monitor and browser interactions
        run: |
          python3 -m unittest discover -s ui/tests -v
          python3 ui/make_demo.py
          python3 ui/server.py > log/ui-ci.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8765/api/bootstrap > /dev/null; then break; fi
            sleep 0.2
          done
          node ui/tests/browser_smoke.cjs http://127.0.0.1:8765
      - name: Check BDS live UI with isolated synthetic display records
        run: |
          mkdir -p build
          python3 -u ui/tests/test_gnss_live.py --serve build/live-ui-ci 18866 > build/live-ui-ci.log 2>&1 &
          live_ui_pid=$!
          trap 'kill "$live_ui_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18866/api/bootstrap > /dev/null; then break; fi
            sleep 0.2
          done
          node ui/tests/gnss_live_browser_smoke.cjs http://127.0.0.1:18866 build/live-ui-ci/test-only/events-000001.jsonl
